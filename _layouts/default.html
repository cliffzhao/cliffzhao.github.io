<script async src="https://www.googletagmanager.com/gtag/js?id=UA-113478503-1"></script>

				</ul>
			</footer>
			<script>
			// Scrollspy: highlight the nav link of the section currently at the top.
			(function () {
				var links = Array.prototype.slice.call(document.querySelectorAll('.site-nav .nav-links a'));
				var sections = [];
				links.forEach(function (a) {
					var sec = document.getElementById(a.getAttribute('href').slice(1));
					if (sec) sections.push({ link: a, sec: sec });
				});
				var offset = 90; // nav height + a little breathing room
				var ticking = false;
				function update() {
					ticking = false;
					var current = sections[0];
					sections.forEach(function (s) {
						if (s.sec.getBoundingClientRect().top - offset <= 0) current = s;
					});
					links.forEach(function (a) { a.classList.remove('active'); });
					if (current) current.link.classList.add('active');
				}
				window.addEventListener('scroll', function () {
					if (!ticking) { ticking = true; requestAnimationFrame(update); }
				}, { passive: true });
				update();
			})();
			</script>
		</body>
	</html>
